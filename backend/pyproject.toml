[project]
name = "careledger"
version = "0.1.0"
description = "CareLedger: hospital financial management system (demo, synthetic data only)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.2",
  "pydantic==2.11.4",
  "pydantic-settings==2.9.1",
  "sqlalchemy==2.0.41",
  "alembic==1.15.2",
  "psycopg[binary]==3.2.9",
  "pyjwt==2.10.1",
  "argon2-cffi==23.1.0",
  "structlog==25.3.0",
  "celery[redis]==5.5.2",
  "reportlab==4.4.1",
  "faker==37.3.0",
  "python-multipart==0.0.20",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.5",
  "pytest-asyncio==0.26.0",
  "pytest-cov==6.1.1",
  "httpx==0.28.1",
  "hypothesis==6.131.17",
  "ruff==0.11.10",
  "mypy==1.15.0",
  "celery-types==0.23.0",
  "pre-commit==4.2.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "seed*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "SIM", "RUF", "ANN", "DTZ"]
ignore = ["S101", "B008", "RUF001", "RUF002", "RUF003", "RUF012", "ANN401", "N818", "S105"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ANN", "N802", "E501"]
"seed/**" = ["S311"]
"alembic/**" = ["ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "seed"]

[[tool.mypy.overrides]]
module = ["reportlab.*", "celery.*", "kombu.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning:passlib.*"]

[tool.coverage.run]
source = ["app"]
omit = ["app/jobs/*"]
