name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: careledger
          POSTGRES_PASSWORD: careledger
          POSTGRES_DB: careledger
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U careledger" --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install into venv
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"
      - name: Ruff
        run: .venv/bin/ruff check . && .venv/bin/ruff format --check .
      - name: Mypy
        run: .venv/bin/mypy
      - name: Tests
        run: .venv/bin/pytest --cov --cov-report=term-missing:skip-covered
      - name: Migrations match models
        env:
          DATABASE_URL: postgresql+psycopg://careledger:careledger@localhost:5432/careledger_test
        run: .venv/bin/alembic check
      - name: OpenAPI client is up to date
        run: |
          .venv/bin/python -m app.export_openapi ../frontend/openapi.json
          git diff --exit-code ../frontend/openapi.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Generated client is up to date
        run: npm run gen:client && git diff --exit-code lib/api/schema.d.ts
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Boot the full stack
        run: docker compose up -d --build --wait
      - name: Seed and smoke test
        run: |
          docker compose exec -T api python -m seed
          curl -fsS http://localhost:8000/api/v1/health
          curl -fsS http://localhost:3000/login > /dev/null
      - name: Logs on failure
        if: failure()
        run: docker compose logs
